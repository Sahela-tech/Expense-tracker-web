<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-wallet"></i> Expense Tracker</h1>
        
        <div class="balance-container">
            <div class="balance-card total">
                <h3>Total Expense</h3>
                <p id="total-amount">Rs. 0.00</p>
            </div>
        </div>

        <div class="form-container">
            <h2>Add New Transaction</h2>
            <form id="expense-form">
                <div class="form-group">
                    <label for="title">Title</label>
                    <input type="text" id="title" placeholder="e.g. Grocery Shopping" required>
                </div>
                <div class="form-group">
                    <label for="amount">Amount (Rs.)</label>
                    <input type="number" id="amount" placeholder="0.00" step="0.01" required>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="Food">Food & Dining</option>
                        <option value="Bills">Bills & Utilities</option>
                        <option value="Transport">Transportation</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <button type="submit" class="btn">Add Expense</button>
            </form>
        </div>

        <div class="history-container">
            <h2>Transaction History</h2>
            <ul id="expense-list" class="expense-list"></ul>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
